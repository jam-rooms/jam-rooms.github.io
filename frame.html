<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; child-src blob:; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<title>frame</title>
<style>
html, body { margin: 0; padding: 0; background: #0e1116; color: #e8eaed;
  font-family: system-ui, "Segoe UI", sans-serif; }
canvas { display: block; width: 100%; height: auto; background: #11151c; touch-action: none; }
canvas:focus-visible { outline: 2px solid #4c9aff; outline-offset: -2px; }
.room-text { margin: 8px; padding: 6px 8px; border: 1px solid #2a2f3a; border-radius: 6px;
  background: #151a22; font-size: 12px; line-height: 1.5; }
.room-text-label { margin: 0 0 4px; color: #9aa4b2; font-size: 11px; }
.room-text-note { margin: 6px 0 0; color: #fbbf24; font-size: 11px; }
.room-text-line { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<canvas id="surface" tabindex="0"></canvas>
<div id="output"></div>
<script>
(() => {
  var ok = (value) => ({ ok: true, value });
  var fail = (code, detail) => detail === undefined ? { ok: false, code } : { ok: false, code, detail };
  var NAME_PATTERN = /^[a-z][a-z0-9-]{0,39}$/;
  var SHA256_PATTERN = /^[0-9a-f]{64}$/;
  var FLOORS = {
    codeChars: 48000,
    checkMs: 2000,
    describeBytes: 262144,
    canvasSize: 4096
  };
  var FIXED = {
    bodyChars: 65536,
    manualChars: 48000,
    depsMax: 16,
    libCountMax: 16,
    libBytesMax: 4194304,
    libTotalBytesMax: 16777216,
    bundleBytesMax: 16777216,
    modulesMax: 2000,
    wasmMemoryBytes: 67108864,
    childExtraBytes: 134217728,
    messagesPerSecond: 1000,
    textCharsPerCall: 2000,
    textTotalBytes: 65536,
    titleChars: 200,
    licenseChars: 100,
    watchIntervalMs: 25,
    childGraceMs: 500,
    parentGraceMs: 2000,
    watchLoadMs: 1e4,
    watchSilenceMs: 2000,
    pingMs: 250,
    fetchTimeoutMs: 30000,
    apiBytesMax: 8388608,
    frameGapMs: 1000,
    frameTickMs: 100,
    frameTickSlackMs: 500,
    errorsMax: 20,
    errorChars: 300,
    frameReadyMs: 1e4,
    textLinesMax: 200,
    keyChars: 32
  };
  var LIMIT_RANGES = {
    codeChars: { min: 1, max: FLOORS.codeChars },
    checkMs: { min: 1, max: FLOORS.checkMs },
    describeBytes: { min: 1, max: FLOORS.describeBytes },
    canvasWidth: { min: 16, max: FLOORS.canvasSize },
    canvasHeight: { min: 16, max: FLOORS.canvasSize }
  };
  var encoder = new TextEncoder;
  var utf8Bytes = (text) => encoder.encode(text).length;
  var WORD_PATTERN = /(?<![A-Za-z0-9_])(?:import|export|from)(?![A-Za-z0-9_])/g;
  var SPACE_PATTERN = /\s/y;
  var NAME_CHAR_PATTERN = /[A-Za-z0-9_$\\\u0080-\uFFFF]/y;
  var SPECIFIER_PATTERN = /(["'])((?:room|lib):[a-z][a-z0-9-]{0,39})\1/y;
  var SEQUENCE_PATTERN = /[\sA-Za-z0-9_$,{}*\u0080-\uFFFF]*/y;
  var FAIL = { kind: "fail" };
  var pass = (span = null, skipUntil = 0) => ({ kind: "pass", span, skipUntil });
  var isSpaceAt = (text, index) => {
    SPACE_PATTERN.lastIndex = index;
    return SPACE_PATTERN.test(text);
  };
  var skipSpaces = (code, from) => {
    let index = from;
    while (index < code.length && isSpaceAt(code, index))
      index += 1;
    return index;
  };
  var isQuoteAt = (code, index) => {
    const ch = code.charAt(index);
    return ch === '"' || ch === "'";
  };
  var isCommentAt = (code, index) => code.startsWith("//", index) || code.startsWith("/*", index);
  var isNameCharAt = (code, index) => {
    if (index >= code.length)
      return false;
    NAME_CHAR_PATTERN.lastIndex = index;
    return NAME_CHAR_PATTERN.test(code);
  };
  var specifierAt = (code, index) => {
    SPECIFIER_PATTERN.lastIndex = index;
    const match = SPECIFIER_PATTERN.exec(code);
    if (match === null)
      return null;
    const specifier = match[2];
    if (specifier === undefined)
      return null;
    return { start: index + 1, end: index + specifier.length + 1, specifier };
  };
  var isWordChar = (ch) => {
    const code = ch.charCodeAt(0);
    return code >= 48 && code <= 57 || code >= 65 && code <= 90 || code >= 97 && code <= 122 || code === 95;
  };
  var trimSpacesEnd = (text) => {
    let end = text.length;
    while (end > 0 && isSpaceAt(text, end - 1))
      end -= 1;
    return text.slice(0, end);
  };
  var endsWithWordFrom = (text) => text.length >= 4 && text.endsWith("from") && (text.length === 4 || !isWordChar(text.charAt(text.length - 5)));
  var checkSequence = (code, from) => {
    SEQUENCE_PATTERN.lastIndex = from;
    const match = SEQUENCE_PATTERN.exec(code);
    if (match === null)
      return FAIL;
    const sequence = match[0];
    const end = from + sequence.length;
    if (!isQuoteAt(code, end))
      return FAIL;
    if (!endsWithWordFrom(trimSpacesEnd(sequence)))
      return FAIL;
    return pass(null, end);
  };
  var checkImport = (code, index) => {
    const afterWord = index + 6;
    const afterMeta = afterWord + 5;
    if (code.startsWith(".meta", afterWord) && !isNameCharAt(code, afterMeta)) {
      return pass();
    }
    const afterSpaces = skipSpaces(code, afterWord);
    if (isQuoteAt(code, afterSpaces)) {
      const span = specifierAt(code, afterSpaces);
      return span === null ? FAIL : pass(span, afterWord);
    }
    return checkSequence(code, afterWord);
  };
  var checkExport = (code, index) => {
    const afterWord = index + 6;
    const afterSpaces = skipSpaces(code, afterWord);
    if (isCommentAt(code, afterSpaces))
      return FAIL;
    if (code.charAt(afterSpaces) === "*")
      return checkSequence(code, afterWord);
    return pass();
  };
  var checkFrom = (code, index) => {
    const afterWord = index + 4;
    const before = code.charAt(index - 1);
    if (isQuoteAt(code, index - 1) && code.charAt(afterWord) === before)
      return pass();
    const afterSpaces = skipSpaces(code, afterWord);
    if (isCommentAt(code, afterSpaces))
      return FAIL;
    if (isQuoteAt(code, afterSpaces)) {
      const span = specifierAt(code, afterSpaces);
      return span === null ? FAIL : pass(span, afterWord);
    }
    return pass();
  };
  var checkWord = (code, word, index) => {
    if (word === "import")
      return checkImport(code, index);
    if (word === "export")
      return checkExport(code, index);
    return checkFrom(code, index);
  };
  var lineAt = (code, index) => {
    let line = 1;
    for (let i = 0;i < index; i += 1) {
      if (code.charCodeAt(i) === 10)
        line += 1;
    }
    return line;
  };
  var findSpecifiers = (code) => {
    const spans = [];
    let skipUntil = 0;
    let spanEnd = 0;
    WORD_PATTERN.lastIndex = 0;
    for (let match = WORD_PATTERN.exec(code);match !== null; match = WORD_PATTERN.exec(code)) {
      const word = match[0];
      const index = match.index;
      if (index < spanEnd)
        continue;
      if (word !== "from" && index < skipUntil)
        continue;
      const outcome = checkWord(code, word, index);
      if (outcome.kind === "fail") {
        return fail("bad-import", `line:${lineAt(code, index)}`);
      }
      if (outcome.span !== null) {
        spans.push(outcome.span);
        spanEnd = outcome.span.end;
      }
      if (outcome.skipUntil > skipUntil)
        skipUntil = outcome.skipUntil;
    }
    return ok(spans);
  };
  var REPLACEMENT_PATTERN = /^[A-Za-z0-9:/._-]{1,500}$/;
  var rewriteSpecifiers = (code, resolve) => {
    const found = findSpecifiers(code);
    if (!found.ok)
      return found;
    const pieces = [];
    let cursor = 0;
    for (const span of found.value) {
      const replacement = resolve(span.specifier);
      if (replacement === undefined || !REPLACEMENT_PATTERN.test(replacement))
        continue;
      pieces.push(code.slice(cursor, span.start), replacement);
      cursor = span.end;
    }
    pieces.push(code.slice(cursor));
    return ok(pieces.join(""));
  };
  var BLANK_LOOKING = new Set(["⠀", "\uD81B\uDFE4", "\uD834\uDD59"]);
  var ELLIPSIS = "…";
  var REMOVED_CHARS = /[\p{Cc}\p{Cs}\p{Zl}\p{Zp}\p{Default_Ignorable_Code_Point}\p{Bidi_Control}\uFFF9-\uFFFB]/gu;
  var ALNUM = "0-9A-Za-z\\uFF10-\\uFF19\\uFF21-\\uFF3A\\uFF41-\\uFF5A";
  var CODE_CHAR = "[0-9A-Z\\uFF10-\\uFF19\\uFF21-\\uFF3A]";
  var AUTH_CODE = new RegExp(`(?<![${ALNUM}])${CODE_CHAR}{4}\\s{0,3}[-\\u2010-\\u2015\\u2212\\uFE58\\uFE63\\uFF0D]\\s{0,3}` + `${CODE_CHAR}{4}(?![${ALNUM}])`, "gu");
  var asText = (value) => typeof value === "string" ? value : "";
  var stripControls = (text) => asText(text).replace(REMOVED_CHARS, (char) => char === `
` || char === "\t" ? char : "");
  var clip = (text, maxChars) => {
    const source = asText(text);
    if (maxChars === Number.POSITIVE_INFINITY)
      return source;
    const max = typeof maxChars === "number" && Number.isFinite(maxChars) ? Math.max(0, Math.trunc(maxChars)) : 0;
    let kept = "";
    let count = 0;
    for (const char of source) {
      if (count >= max)
        return kept + ELLIPSIS;
      kept += char;
      count += 1;
    }
    return kept;
  };
  var FAIL_CODES = ["lock-failed", "load-error", "no-start", "start-error"];
  var isPlainObject = (value) => {
    if (typeof value !== "object" || value === null)
      return false;
    try {
      const proto = Object.getPrototypeOf(value);
      return proto === Object.prototype || proto === null;
    } catch {
      return false;
    }
  };
  var hasOnlyKeys2 = (value, expected) => {
    const keys = Object.keys(value);
    if (keys.length !== expected.length)
      return false;
    for (const key of expected) {
      if (!Object.hasOwn(value, key))
        return false;
    }
    return true;
  };
  var isSafeCount = (value) => typeof value === "number" && Number.isSafeInteger(value) && value >= 0;
  var isStringAtMost = (value, max) => typeof value === "string" && value.length <= max;
  var isName = (value) => typeof value === "string" && NAME_PATTERN.test(value);
  var isFailCode = (value) => {
    if (typeof value !== "string")
      return false;
    return FAIL_CODES.some((code) => code === value);
  };
  var isCanvasSize = (value) => typeof value === "number" && Number.isInteger(value) && value >= 16 && value <= FLOORS.canvasSize;
  var parseWorkerMessage = (data) => {
    try {
      if (!isPlainObject(data))
        return;
      const t = data["t"];
      if (t === "ready" || t === "running") {
        return hasOnlyKeys2(data, ["t"]) ? { t } : undefined;
      }
      if (t === "failed") {
        if (!hasOnlyKeys2(data, ["t", "code", "detail"]))
          return;
        const code = data["code"];
        const detail = data["detail"];
        if (!isFailCode(code) || !isStringAtMost(detail, FIXED.errorChars))
          return;
        return { t, code, detail };
      }
      if (t === "text") {
        if (!hasOnlyKeys2(data, ["t", "s"]))
          return;
        const s = data["s"];
        if (!isStringAtMost(s, FIXED.textCharsPerCall))
          return;
        return { t, s };
      }
      if (t === "error") {
        if (!hasOnlyKeys2(data, ["t", "detail"]))
          return;
        const detail = data["detail"];
        if (!isStringAtMost(detail, FIXED.errorChars))
          return;
        return { t, detail };
      }
      if (t === "pong") {
        if (!hasOnlyKeys2(data, ["t", "n", "frames"]))
          return;
        const n = data["n"];
        const frames = data["frames"];
        if (!isSafeCount(n) || !isSafeCount(frames))
          return;
        return { t, n, frames };
      }
      return;
    } catch {
      return;
    }
  };
  var parsePairs = (value) => {
    if (!Array.isArray(value))
      return;
    const pairs = [];
    for (const item of value) {
      if (!Array.isArray(item) || item.length !== 2)
        return;
      const name = item[0];
      const code = item[1];
      if (!isName(name) || typeof code !== "string")
        return;
      pairs.push([name, code]);
    }
    return pairs;
  };
  var parseModules = (value) => {
    if (!Array.isArray(value))
      return;
    const modules = [];
    for (const item of value) {
      if (!isPlainObject(item))
        return;
      if (!hasOnlyKeys2(item, ["name", "author", "order", "floating"]))
        return;
      const name = item["name"];
      const author = item["author"];
      const order = item["order"];
      const floating = item["floating"];
      if (!isName(name) || typeof author !== "string" || !isSafeCount(order) || typeof floating !== "boolean") {
        return;
      }
      modules.push({ name, author, order, floating });
    }
    return modules;
  };
  var parseBootRoom = (value) => {
    if (!isPlainObject(value))
      return;
    if (!hasOnlyKeys2(value, ["entry", "sources", "libs", "modules", "seed", "width", "height"]))
      return;
    const entry = value["entry"];
    const seed = value["seed"];
    const width = value["width"];
    const height = value["height"];
    if (!isName(entry) || typeof seed !== "string" || !SHA256_PATTERN.test(seed))
      return;
    if (!isCanvasSize(width) || !isCanvasSize(height))
      return;
    const sources = parsePairs(value["sources"]);
    const libs = parsePairs(value["libs"]);
    const modules = parseModules(value["modules"]);
    if (sources === undefined || libs === undefined || modules === undefined)
      return;
    return { entry, sources, libs, modules, seed, width, height };
  };
  var parseOuterMessage = (data) => {
    try {
      if (!isPlainObject(data))
        return;
      const t = data["t"];
      if (t === "visible") {
        if (!hasOnlyKeys2(data, ["t", "value"]))
          return;
        const value = data["value"];
        return typeof value === "boolean" ? { t, value } : undefined;
      }
      if (t === "boot") {
        if (!hasOnlyKeys2(data, ["t", "room"]))
          return;
        const room = parseBootRoom(data["room"]);
        return room === undefined ? undefined : { t, room };
      }
      return;
    } catch {
      return;
    }
  };

  var PREVENTED_KEYS = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Spacebar", "PageUp", "PageDown"]);
  var clamp = (value, max) => {
    if (!Number.isFinite(value))
      return 0;
    if (value < 0)
      return 0;
    if (value > max)
      return max;
    return value;
  };
  var toCanvasPoint = (client, rect, size) => {
    if (rect.width <= 0 || rect.height <= 0 || size.width <= 0 || size.height <= 0) {
      return { x: 0, y: 0 };
    }
    const x = (client.x - rect.left) / rect.width * size.width;
    const y = (client.y - rect.top) / rect.height * size.height;
    return { x: clamp(x, size.width), y: clamp(y, size.height) };
  };
  var defaultSchedule = (callback) => {
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(() => {
        callback();
      });
      return;
    }
    setTimeout(callback, 16);
  };
  var bindInput = (canvas, deps) => {
    const schedule = deps.schedule ?? defaultSchedule;
    let pendingMove = null;
    let moveScheduled = false;
    const flushMove = () => {
      moveScheduled = false;
      const event = pendingMove;
      pendingMove = null;
      if (event !== null)
        deps.send(event);
    };
    const pointOf = (event) => toCanvasPoint({ x: event.clientX, y: event.clientY }, canvas.getBoundingClientRect(), { width: canvas.width, height: canvas.height });
    const pointerEvent = (type, event) => {
      const point = pointOf(event);
      return {
        kind: "pointer",
        type,
        id: event.pointerId,
        x: point.x,
        y: point.y,
        buttons: event.buttons,
        pointerType: event.pointerType
      };
    };
    const onPointerDown = (event) => {
      canvas.focus();
      deps.send(pointerEvent("down", event));
    };
    const onPointerMove = (event) => {
      pendingMove = pointerEvent("move", event);
      if (moveScheduled)
        return;
      moveScheduled = true;
      schedule(flushMove);
    };
    const onPointerUp = (event) => {
      deps.send(pointerEvent("up", event));
    };
    const onPointerCancel = (event) => {
      deps.send(pointerEvent("cancel", event));
    };
    const onKey = (type, event) => {
      if (event.ctrlKey || event.metaKey || event.altKey)
        return;
      if (PREVENTED_KEYS.has(event.key))
        event.preventDefault();
      deps.send({
        kind: "key",
        type,
        key: event.key.slice(0, FIXED.keyChars),
        code: event.code.slice(0, FIXED.keyChars),
        repeat: event.repeat
      });
    };
    const onKeyDown = (event) => {
      onKey("down", event);
    };
    const onKeyUp = (event) => {
      onKey("up", event);
    };
    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerCancel);
    canvas.addEventListener("keydown", onKeyDown);
    canvas.addEventListener("keyup", onKeyUp);
    return () => {
      canvas.removeEventListener("pointerdown", onPointerDown);
      canvas.removeEventListener("pointermove", onPointerMove);
      canvas.removeEventListener("pointerup", onPointerUp);
      canvas.removeEventListener("pointercancel", onPointerCancel);
      canvas.removeEventListener("keydown", onKeyDown);
      canvas.removeEventListener("keyup", onKeyUp);
    };
  };

  var WINDOW_MS = 1000;
  var createRateLimit = (perSecond) => {
    const limit = Number.isInteger(perSecond) && perSecond > 0 ? perSecond : 0;
    const size = limit + 1;
    const times = new Array(size);
    let head = 0;
    let count = 0;
    const hit = (nowMs) => {
      const cutoff = nowMs - WINDOW_MS;
      while (count > 0) {
        const oldest = times[head];
        if (oldest !== undefined && oldest > cutoff)
          break;
        head = (head + 1) % size;
        count -= 1;
      }
      const over = count >= limit;
      if (count === size) {
        times[head] = nowMs;
        head = (head + 1) % size;
      } else {
        times[(head + count) % size] = nowMs;
        count += 1;
      }
      return over;
    };
    return { hit };
  };

  var createSilenceWatch = (limits) => {
    const pending = [];
    let base = null;
    let running = false;
    let visible = true;
    const restart = (now) => {
      pending.length = 0;
      base = now;
    };
    return {
      sent: (n, now) => {
        pending.push({ n, at: now });
      },
      pong: (n, now) => {
        const index = pending.findIndex((ping) => ping.n === n);
        if (index < 0)
          return;
        pending.splice(0, index + 1);
        if (pending.length === 0)
          base = now;
      },
      running: (now) => {
        running = true;
        restart(now);
      },
      setVisible: (value, now) => {
        if (value === visible)
          return;
        visible = value;
        if (value)
          restart(now);
      },
      isSilent: (now) => {
        if (!visible)
          return false;
        const oldest = pending[0]?.at ?? base;
        if (oldest === null)
          return false;
        return now - oldest > (running ? limits.silenceMs : limits.loadMs);
      }
    };
  };

  var noSession = {
    close: () => {
      return;
    },
    input: () => {
      return;
    },
    setVisible: () => {
      return;
    }
  };
  var createSession = (room, deps) => {
    const created = [];
    const libUrls = new Map;
    const sourceUrls = new Map;
    let worker = null;
    let ready = false;
    let stopped = false;
    const rate = createRateLimit(FIXED.messagesPerSecond);
    let statsAt = Number.NEGATIVE_INFINITY;
    let running = false;
    let errorCount = 0;
    const startedAt = deps.now();
    const silence = createSilenceWatch({ loadMs: FIXED.watchLoadMs, silenceMs: FIXED.watchSilenceMs });
    let timer = null;
    let lastTick = null;
    let visible = true;
    const makeUrl = (code) => {
      const url = deps.makeUrl(code);
      created.push(url);
      return url;
    };
    const release = () => {
      if (timer !== null) {
        deps.stopTimer(timer);
        timer = null;
      }
      worker?.terminate();
      for (const url of created)
        deps.revokeUrl(url);
      created.length = 0;
    };
    const halt = (code, detail) => {
      if (stopped)
        return;
      stopped = true;
      release();
      deps.send({ t: "stopped", code, detail });
    };
    for (const [name, code] of room.libs) {
      libUrls.set(name, makeUrl(code));
    }
    const resolve = (specifier) => {
      if (specifier.startsWith("room:"))
        return sourceUrls.get(specifier.slice(5));
      if (specifier.startsWith("lib:"))
        return libUrls.get(specifier.slice(4));
      return;
    };
    for (const [name, code] of room.sources) {
      const rewritten = rewriteSpecifiers(code, resolve);
      if (!rewritten.ok) {
        halt("boot-error", `モジュール「${name}」の読み込みを書き換えられません`);
        return noSession;
      }
      sourceUrls.set(name, makeUrl(rewritten.value));
    }
    const urls = Object.create(null);
    for (const [name, url] of sourceUrls)
      urls[name] = url;
    if (typeof urls[room.entry] !== "string") {
      halt("boot-error", `入口「${room.entry}」がありません`);
      return noSession;
    }
    const workerUrl = makeUrl(deps.workerSource);
    try {
      worker = deps.createWorker(workerUrl);
    } catch {
      halt("boot-error", "Worker を起こせません");
      return noSession;
    }
    const active = worker;
    const sendBoot = () => {
      let canvas = null;
      try {
        canvas = deps.surface();
      } catch {
        canvas = null;
      }
      const message = {
        t: "boot",
        urls,
        entry: room.entry,
        modules: room.modules,
        seed: room.seed,
        canvas
      };
      try {
        active.postMessage(message, canvas === null ? [] : [canvas]);
      } catch {
        halt("boot-error", "Worker に起動の材料を渡せません");
      }
    };
    const onTimer = () => {
      if (stopped)
        return;
      const now = deps.now();
      if (!ready) {
        if (now - startedAt > FIXED.watchLoadMs) {
          halt("worker-error", "Worker が時間内に読み込みを終えません");
        }
        return;
      }
      const late = lastTick !== null && now - lastTick >= FIXED.watchSilenceMs;
      lastTick = now;
      if (late) {

        post({ t: "failed", code: "load-error", detail });
        return;
      }
      let namespace;
      try {
        namespace = await importUrl(entryUrl);
      } catch (error) {
        post({ t: "failed", code: "load-error", detail: errorText(error, FIXED.errorChars) });
        return;
      }
      let start;
      try {
        start = namespace?.start;
      } catch (error) {
        post({ t: "failed", code: "load-error", detail: errorText(error, FIXED.errorChars) });
        return;
      }
      if (typeof start !== "function") {
        post({ t: "failed", code: "no-start", detail: "入口に start という関数がありません" });
        return;
      }
      try {
        await start(room);
      } catch (error) {
        post({ t: "failed", code: "start-error", detail: errorText(error, FIXED.errorChars) });
        return;
      }
      post({ t: "running" });
    } catch (error) {
      post({ t: "failed", code: "load-error", detail: errorText(error, FIXED.errorChars) });
    }
  };
  var onMessage = (event) => {
    const message = parseHostMessage(event.data);
    if (message === undefined)
      return;
    if (message.t === "ping") {
      post({ t: "pong", n: message.n, frames: frames() });
      return;
    }
    if (message.t === "input") {
      dispatch(message.event);
      return;
    }
    if (!locked || booted)
      return;
    booted = true;
    boot(message);
  };
  scope.addEventListener("message", onMessage);
  scope.addEventListener("error", (event) => {
    report(errorEventText(event, FIXED.errorChars));
  });
  scope.addEventListener("unhandledrejection", (event) => {
    report(errorEventText(event, FIXED.errorChars));
  });
  if (locked) {
    post({ t: "ready" });
  } else {
    post({ t: "failed", code: "lock-failed", detail: errorText(remaining.join(", "), FIXED.errorChars) });
  }
})();
`,
          makeUrl: (code) => URL.createObjectURL(new Blob([code], { type: "text/javascript" })),
          revokeUrl: (url) => {
            URL.revokeObjectURL(url);
          },
          createWorker: (url) => new Worker(url),
          send,
          text: (value) => {
            text.add(value);
          },
          now: () => Date.now(),
          surface,
          nextPing,
          startTimer: (callback, intervalMs) => window.setInterval(callback, intervalMs),
          stopTimer: (handle) => {
            window.clearInterval(handle);
          }
        });
        session.setVisible(visible);
      } catch {
        send({ t: "stopped", code: "boot-error", detail: "起動の準備ができません" });
        return;
      }
      bindInput(canvas, {
        send: (event) => {
          session?.input(event);
        }
      });
    };
    const onPortMessage = (event) => {
      const message = parseOuterMessage(event.data);
      if (message === undefined)
        return;
      if (message.t === "visible") {
        visible = message.value;
        session?.setVisible(visible);
        return;
      }
      if (booted)
        return;
      booted = true;
      onBoot(message.room);
    };
    const onWindowMessage = (event) => {
      if (port !== null)
        return;
      if (event.source !== window.parent)
        return;
      if (event.origin !== parentOrigin)
        return;
      if (!isPortMessage(event.data))
        return;
      if (event.ports.length !== 1)
        return;
      const received = event.ports[0];
      if (received === undefined)
        return;
      window.removeEventListener("message", onWindowMessage);
      port = received;
      received.addEventListener("message", onPortMessage);
      received.start();
    };
    window.addEventListener("message", onWindowMessage);
    window.parent.postMessage({ t: "ready" }, parentOrigin);
  };
  start();
})();

</script>
