<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src https:; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>jamroom 下見</title>
<link rel="icon" href="data:,">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: #0e1116; color: #e8eaed;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
h1 { font-size: clamp(16px, 4vw, 22px); margin: 0 0 8px; font-weight: 600; }
h2 { font-size: 14px; margin: 20px 0 6px; color: #9aa4b2; }
.big { font-size: clamp(26px, 8vw, 44px); font-weight: 700; line-height: 1.2; margin: 8px 0 12px; }
.big[data-tone="ok"] { color: #4ade80; }
.big[data-tone="bad"] { color: #f87171; }
.problems p { color: #fbbf24; margin: 4px 0; font-size: 13px; }
.frame-host iframe { width: 100%; height: min(95vw, 470px); border: 1px solid #2a2f3a;
  border-radius: 8px; background: #fff; }
.table-wrap { overflow-x: auto; margin-top: 16px; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 12px; }
th, td { border-bottom: 1px solid #252a34; padding: 5px 6px; text-align: left; vertical-align: top; }
th { color: #9aa4b2; font-weight: 600; position: sticky; top: 0; background: #0e1116; }
tr[data-verdict="pass"] td:nth-child(5) { color: #4ade80; }
tr[data-verdict="FAIL"] td:nth-child(5), tr[data-verdict="error"] td:nth-child(5) { color: #f87171; }
tr[data-verdict="info"] td:nth-child(5) { color: #93c5fd; }
pre { white-space: pre-wrap; word-break: break-word; background: #151a22; padding: 10px;
  border-radius: 8px; font-size: 12px; }
textarea { width: 100%; height: 260px; background: #151a22; color: #d7dce3;
  border: 1px solid #2a2f3a; border-radius: 8px; padding: 8px;
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 11px; }
a { color: #93c5fd; }
.card { margin-top: 16px; padding: 12px; background: #151a22; border: 1px solid #252a34; border-radius: 10px; }
.card p { margin: 6px 0; font-size: 15px; line-height: 1.5; word-break: break-word; }
.card h2 { margin-top: 0; }
#sha { height: 72px; font-size: 12px; }
#describe { max-height: 320px; overflow: auto; }
#preview-error { color: #fbbf24; }
#verdict-line[data-tone="ok"] { color: #4ade80; }
#verdict-line[data-tone="bad"] { color: #fca5a5; }
.buttons { display: flex; gap: 10px; margin: 4px 0 12px; }
.buttons button { flex: 1; font-size: 16px; padding: 12px 10px; border-radius: 10px;
  border: 1px solid #2a2f3a; background: #1d2430; color: #e8eaed; font-family: inherit; }
.buttons button:disabled { opacity: 0.45; }
</style>
</head>
<body>
<header>
<h1>jamroom 下見</h1>
<div id="status" class="big" data-tone="idle">準備中</div>
<div id="problems" class="problems"></div>
</header>
<section class="card">
<h2>イシュー</h2>
<p id="issue-line">—</p>
<p id="name-line">—</p>
<p id="chars-line">—</p>
<label for="sha">コードの SHA-256</label>
<textarea id="sha" readonly></textarea>
<p id="labels-line">—</p>
<p id="verdict-line">—</p>
<p id="ratelimit-line">—</p>
</section>
<section class="card">
<h2>下見</h2>
<div class="buttons">
<button id="again" type="button">もう一度動かす</button>
<button id="stop" type="button">止める</button>
</div>
<p id="describe-line">describe</p>
<pre id="describe">—</pre>
<p id="frames-line">—</p>
<p id="preview-error"></p>
<div id="frame-host" class="frame-host"></div>
</section>
<script src="dist/preview.js"></script>
</body>
</html>
